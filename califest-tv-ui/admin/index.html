<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Califest TV — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --bg: #0d0712;
      --panel: #1a1024;
      --line: rgba(255, 255, 255, 0.12);
      --red: #e53b26;
      --gold: #f5b335;
      --text: #ffffff;
      --muted: #bfb3d1;
    }
    body { font-family: 'Poppins', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    a { color: inherit; text-decoration: none; }

    /* Login */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(120% 70% at 50% 0%, #4a1866, #0c0412); }
    .login-card { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 32px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); }
    .login-card h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 2rem; margin-bottom: 4px; }
    .login-card h1 em { font-family: 'Poppins', sans-serif; font-style: italic; font-weight: 900; color: var(--red); font-size: 1.5rem; margin-left: 4px; }
    .login-card p { color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; }
    .err { color: #ff8a7a; font-size: 0.88rem; min-height: 1.2em; margin-top: 10px; }

    /* Layout */
    .admin { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .side { background: #120a1a; border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
    .side-logo { font-family: 'Pacifico', cursive; font-size: 1.6rem; padding: 0 8px; }
    .side-logo em { font-family: 'Poppins', sans-serif; font-style: italic; font-weight: 900; color: var(--red); font-size: 1.2rem; margin-left: 4px; }
    .side-label { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 8px; }
    .side nav { display: flex; flex-direction: column; gap: 4px; }
    .side nav button { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 6px; text-align: left; color: var(--muted); font-weight: 600; }
    .side nav button i { width: 18px; text-align: center; }
    .side nav button:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .side nav button.active { background: var(--red); color: #fff; }
    .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
    .side-foot a, .side-foot button { display: flex; gap: 10px; align-items: center; padding: 10px 12px; color: var(--muted); font-size: 0.88rem; border-radius: 6px; }
    .side-foot a:hover, .side-foot button:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }

    .main { padding: 26px 32px 60px; min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .topbar h1 { font-size: 1.5rem; font-weight: 800; }
    .actions { display: flex; align-items: center; gap: 12px; }
    .dirty { font-size: 0.82rem; color: var(--gold); font-weight: 600; }
    .status { padding: 12px 16px; border-radius: 6px; margin-bottom: 18px; font-weight: 600; font-size: 0.9rem; }
    .status.ok { background: rgba(70, 211, 105, 0.12); border: 1px solid rgba(70, 211, 105, 0.4); color: #8ff0aa; }
    .status.err { background: rgba(229, 59, 38, 0.12); border: 1px solid rgba(229, 59, 38, 0.45); color: #ffa597; }
    .intro { color: var(--muted); margin-bottom: 18px; font-size: 0.92rem; line-height: 1.55; max-width: 760px; }

    /* Cards and fields */
    .card, .item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 14px; }
    .item-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .item-head strong { flex: 1; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-no { font-size: 0.75rem; font-weight: 700; color: var(--gold); background: rgba(245, 179, 53, 0.12); padding: 3px 8px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .fld { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; font-weight: 600; color: var(--muted); min-width: 0; }
    .fld.full { grid-column: 1 / -1; }
    .fld.check { flex-direction: row; align-items: center; gap: 10px; color: #fff; font-size: 0.9rem; }
    .fld.check input { width: 18px; height: 18px; accent-color: var(--red); }
    .input { width: 100%; padding: 10px 12px; border-radius: 6px; background: #0c0712; border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; font-size: 0.9rem; font-weight: 400; }
    .input:focus { outline: none; border-color: var(--gold); }
    textarea.input { min-height: 84px; resize: vertical; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; }
    .btn-red { background: linear-gradient(180deg, #f0553a, #c42414); color: #fff; }
    .btn-ghost { border: 1px dashed rgba(255, 255, 255, 0.3); color: var(--muted); width: 100%; justify-content: center; padding: 14px; }
    .btn-ghost:hover { color: #fff; border-color: #fff; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .icon-btn { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); color: var(--muted); }
    .icon-btn.danger:hover { background: rgba(229, 59, 38, 0.2); color: #ff9a8a; }
    .empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; margin-bottom: 14px; }

    @media (max-width: 860px) {
      .admin { grid-template-columns: 1fr; }
      .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
      .side nav { flex-direction: row; flex-wrap: wrap; }
      .side-label { display: none; }
      .side-foot { margin-top: 0; flex-direction: row; }
      .grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px 60px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <h1>Califest<em>TV</em></h1>
      <p>Admin dashboard. Enter your admin password to manage the channel.</p>
      <input class="input" id="login-pass" type="password" placeholder="Admin password" autocomplete="current-password" required />
      <button class="btn btn-red" type="submit" style="width: 100%; justify-content: center;"><i class="fa-solid fa-lock"></i> Log in</button>
      <div id="login-err" class="err"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="app" class="admin" hidden>
    <aside class="side">
      <div class="side-logo">Califest<em>TV</em></div>
      <div class="side-label">Dashboard</div>
      <nav>
        <button type="button" data-sec="live" class="active"><i class="fa-solid fa-tower-broadcast"></i> Live Stream</button>
        <button type="button" data-sec="channels"><i class="fa-solid fa-satellite-dish"></i> Live Channels</button>
        <button type="button" data-sec="shows"><i class="fa-solid fa-film"></i> Shows</button>
        <button type="button" data-sec="highlights"><i class="fa-solid fa-star"></i> Highlights</button>
        <button type="button" data-sec="events"><i class="fa-solid fa-calendar-days"></i> Events</button>
        <button type="button" data-sec="packages"><i class="fa-solid fa-rectangle-ad"></i> Sponsor Packages</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</a>
        <button type="button" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="sec-title"></h1>
        <div class="actions">
          <span id="dirty-note" class="dirty" hidden>Unsaved changes</span>
          <button id="save-btn" class="btn btn-red" type="button"><i class="fa-solid fa-floppy-disk"></i> Save &amp; Publish</button>
        </div>
      </header>
      <div id="status" class="status" hidden></div>
      <section id="sec-body"></section>
    </main>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
